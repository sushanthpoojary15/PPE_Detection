<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to right, #4e54c8, #8f94fb);
            padding: 50px;
            font-family: 'Segoe UI', sans-serif;
        }
        .card {
            transition: transform 0.3s, box-shadow 0.3s;
            border: none;
            border-radius: 20px;
            overflow: hidden;
        }
        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.2);
        }
        .card-body {
            color: white;
            background: linear-gradient(to top left, #6a11cb, #2575fc);
            text-align: center;
            padding: 40px 20px;
        }
        .card-title {
            font-size: 1.5rem;
            font-weight: bold;
        }
        .dashboard-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
        }
        a.card {
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="text-white text-center mb-5">Welcome to Your Dashboard</h2>
        <div class="dashboard-container">
            <a href="/profile" class="card">
                <div class="card-body">
                    <h5 class="card-title">Profile</h5>
                    <p>View and edit your personal profile.</p>
                </div>
            </a>
            <a href="{{ url_for('cam_dashboard') }}" class="card">
                <div class="card-body">
                    <h5 class="card-title">Check for PPE Detection</h5>
                    <p>Access system-generated reports and stats.</p>
                </div>
            </a>
            <a href="/settings" class="card">
                <div class="card-body">
                    <h5 class="card-title">Settings</h5>
                    <p>Adjust system preferences and configurations.</p>
                </div>
            </a>
            <a href="/support" class="card">
                <div class="card-body">
                    <h5 class="card-title">Support</h5>
                    <p>Need help? Reach out to the support team.</p>
                </div>
            </a>
            <a href="/logout" class="card">
                <div class="card-body">
                    <h5 class="card-title">Logout</h5>
                    <p>Securely exit your dashboard session.</p>
                </div>
            </a>
        </div>
    </div>
</body>
</html>
