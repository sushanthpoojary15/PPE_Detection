<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
    <title>Document</title>
    <style>
        /* Reset and base styles */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body, html {
    height: 100%;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

.main-bg {
    background: linear-gradient(to right, #2c3e50, #4ca1af);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Container */
.login-container {
    background-color: rgba(255, 255, 255, 0.1);
    padding: 40px;
    border-radius: 15px;
    box-shadow: 0 8px 16px rgba(0,0,0,0.2);
    width: 100%;
    max-width: 400px;
    text-align: center;
    backdrop-filter: blur(10px);
}

/* Heading & Text */
.logo-badge {
    font-size: 60px;
    color: #fff;
    margin-bottom: 20px;
}

h3 {
    margin-bottom: 10px;
    font-size: 26px;
    font-weight: bold;
}

.text-whitesmoke {
    color: #f5f5f5;
}

.text-darkyellow {
    color: #fdd835;
    text-decoration: none;
}

.text-darkyellow:hover {
    text-decoration: underline;
}

.text-center {
    text-align: center;
}

.margin-t {
    margin-top: 20px;
}

.margin-b {
    margin-bottom: 20px;
}

/* Form */
.form-group {
    margin: 15px 0;
}

.form-control {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    font-size: 16px;
    outline: none;
}

.form-button {
    width: 100%;
    padding: 12px;
    background-color: #fdd835;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    color: #2c3e50;
    cursor: pointer;
    transition: background-color 0.3s ease;
}

.form-button:hover {
    background-color: #fbc02d;
}

/* Flash messages */
.flash-messages {
    position: absolute;
    top: 20px;
    width: 90%;
    max-width: 500px;
    left: 50%;
    transform: translateX(-50%);
    list-style: none;
    padding: 0;
}

.message {
    padding: 15px;
    margin-bottom: 10px;
    border-radius: 8px;
    color: white;
    font-weight: bold;
    text-align: center;
}

.message.success {
    background-color: #2ecc71;
}

.message.error {
    background-color: #e74c3c;
}

.message.warning {
    background-color: #f1c40f;
}

/* Animation */
.animated {
    animation-duration: 1s;
    animation-fill-mode: both;
}

@keyframes flipInX {
    from {
        transform: perspective(400px) rotateX(90deg);
        opacity: 0;
    }

    to {
        transform: perspective(400px) rotateX(0deg);
        opacity: 1;
    }
}

.flipInX {
    animation-name: flipInX;
}

    </style>
</head>


<body class="main-bg">

    <div class="login-container text-c animated flipInX">
            <div>
                <h1 class="logo-badge text-whitesmoke"><span class="fa fa-user-circle"></span></h1>
            </div>
                <h3 class="text-whitesmoke">Sign In Template</h3>
                <p class="text-whitesmoke">Sign In</p>
            <div class="container-content">
                <form class="margin-t" method="post" action="{{ url_for('login') }}">
                    <div class="form-group">
                        <input type="text" class="form-control" name="username" placeholder="Username" required="">
                    </div>
                    <div class="form-group">
                        <input type="password" class="form-control" name="password" placeholder="*****" required="">
                    </div>
                    <button type="submit" class="form-button button-l margin-b">Sign In</button>
    
                    <a class="text-darkyellow" href="#"><small>Forgot your password?</small></a>
                    <p class="text-whitesmoke text-center"><small>Do not have an account?</small></p>
                    <a class="text-darkyellow" href="#"><small>Sign Up</small></a>
                </form>
                <p class="margin-t text-whitesmoke"><small> Sushanth and Melvin</small></p>&copy; 2025</small> </p>
            </div>
        </div>
</body>

</html>
